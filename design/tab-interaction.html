<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paseo · Tab 交互预览</title>
<style>
:root{color-scheme:dark;--bg:#1e2129;--panel:#20232c;--line:#343842;--fg:#e0e2e8;--muted:#a3a8b3;--hover:#2c303a;--active:#373d48;--input:#2b303b;--green:#8db89d}*{box-sizing:border-box}body{margin:0;background:#15171c;color:var(--fg);font:13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}button,input,select{font:inherit;color:inherit}button{border:0;cursor:pointer;background:none}button:hover{background:var(--hover)}button:focus-visible,input:focus-visible,select:focus-visible{outline:1px solid var(--muted);outline-offset:-2px}button[disabled]{opacity:.4;cursor:default}.preview{height:44px;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid #333;color:#aab0bd;font-size:12px}.preview b{color:#e7e9ed;font-weight:500}.preview span{margin-right:auto}.preview button{padding:5px 8px;border-radius:4px;color:#c7cbd3}.shell{display:flex;min-height:620px;height:calc(100dvh - 44px);background:var(--bg)}aside{width:208px;flex-shrink:0;padding:18px 8px;background:var(--panel);border-right:1px solid var(--line)}.nav{height:32px;display:flex;gap:10px;align-items:center;padding:0 9px;color:var(--muted);border-radius:6px}.nav.current{background:var(--hover);color:var(--fg);margin-top:16px}.nav.project{margin-top:24px}.nav.small{padding-left:34px;font-size:12px}.app{flex:1;min-width:0;display:flex;flex-direction:column}.app-title{height:34px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 14px;color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;flex:1;min-height:0}.pane{min-width:0;min-height:0;display:flex;flex-direction:column;border-right:1px solid var(--line)}.bar{height:32px;display:flex;align-items:center;gap:3px;padding:3px 4px;border-bottom:1px solid var(--line);flex-shrink:0}.tabs{display:flex;align-items:center;overflow:auto;scrollbar-width:none;gap:2px;min-width:0}.tab{display:flex;align-items:center;max-width:210px;min-width:90px;height:26px;gap:7px;padding:0 6px 0 8px;border-radius:5px;flex-shrink:0;color:var(--muted);white-space:nowrap;position:relative}.tab.active{color:var(--fg);background:var(--active)}.tab .name{overflow:hidden;text-overflow:ellipsis;max-width:155px}.tab .close{opacity:0;width:16px;padding:0;font-size:14px;margin-left:4px;display:grid;place-items:center}.tab:hover .close,.tab.active .close,.tab:focus-within .close{opacity:1}.tools{display:flex;gap:2px;margin-left:auto;flex-shrink:0}.ico{width:24px;height:26px;display:grid;place-items:center;border-radius:4px;color:var(--muted)}.plus{font-size:20px;flex-shrink:0}.ws{width:15px;height:15px;display:inline-grid;place-items:center;border-radius:4px;color:white;font-size:10px;flex-shrink:0;font-weight:600}.front{background:#a66470}.back{background:#5d86a3}.content{flex:1;min-height:0;display:flex;flex-direction:column;padding:24px 24px 14px;position:relative}.thread{flex:1;overflow:auto;font-size:14px;line-height:1.8}.user{background:var(--active);border-radius:16px 2px 16px 16px;padding:11px 16px;margin:12px 0 22px 10%;font-size:14px}.assistant{margin:0 0 28px}.assistant p{margin:10px 0}.muted{color:var(--muted)}.tool{font:12px ui-monospace,monospace;padding:8px 0;color:var(--muted)}.run{font-size:11px;color:var(--muted);margin:18px 0 20px}.composer{background:var(--input);border:1px solid #414652;border-radius:16px;padding:14px 14px 10px;color:var(--muted);margin-top:auto}.composer .placeholder{height:56px;font-size:14px}.composer .bottom{display:flex;gap:10px;align-items:center;font-size:11px}.composer .bottom span:last-child{margin-left:auto}.new-empty{flex:1;display:grid;place-items:center;color:var(--muted)}.new-empty small{display:block;text-align:center;margin-top:8px;font-size:12px}.import{align-self:flex-start;font-size:11px;padding:5px 10px;border:1px solid var(--line);border-radius:16px;margin:12px 0}.terminal{padding:14px 3px;font:12px/1.6 ui-monospace,monospace}.terminal .prompt{color:var(--green)}.file h2{font-size:22px;margin-top:6px}.file p{font-size:14px;line-height:1.8}.scrim{position:fixed;inset:44px 0 0;z-index:20;background:transparent}.popover{position:fixed;z-index:21;width:350px;max-width:calc(100vw - 16px);background:var(--panel);border:1px solid #454a56;box-shadow:0 14px 44px #0005;border-radius:9px;padding:6px;display:flex;flex-direction:column;max-height:440px}.search{display:flex;align-items:center;gap:7px;padding:5px 6px 9px;border-bottom:1px solid var(--line)}.search input{border:0;background:transparent;min-width:0;flex:1;padding:4px;font-size:12px}.search kbd{font-size:10px;color:var(--muted)}.scope{padding:7px 5px;display:flex;gap:8px;align-items:center;font-size:11px}.scope select{background:var(--hover);border:0;border-radius:4px;padding:4px;max-width:220px}.scope label{color:var(--muted)}.row{width:100%;display:flex;align-items:center;gap:9px;text-align:left;padding:9px 8px;border-radius:5px;min-height:38px}.row .text{flex:1;min-width:0}.row .primary{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row .secondary{font-size:10px;color:var(--muted);margin-top:4px}.row .trailing{font-size:10px;color:var(--muted)}.rows{overflow:auto;min-height:0}.section{font-size:10px;color:var(--muted);padding:10px 8px 5px}.quick{border-bottom:1px solid var(--line);padding-bottom:5px}.footer{display:flex;align-items:center;gap:2px;padding:6px 4px 2px;border-top:1px solid var(--line);font-size:10px}.footer button{padding:5px 8px;border-radius:4px;color:var(--muted)}.footer .dest{margin-left:auto}.empty{padding:26px 16px;line-height:1.7;color:var(--muted);font-size:12px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);font-size:12px;background:var(--active);border:1px solid var(--line);border-radius:6px;padding:9px 14px;z-index:40}.light{color-scheme:light;--bg:#f6f6f7;--panel:#fafafa;--line:#dedfe3;--fg:#292d35;--muted:#666c76;--hover:#eceef1;--active:#e0e3e8;--input:#eceef1;--green:#287546}.light .composer{border-color:#d7dae0}.light .popover{border-color:#d3d7de}.light .preview{background:#eee;color:#666}.light .preview b,.light .preview button{color:#333}@media(max-width:850px){aside{display:none}.content{padding:20px 14px 12px}.tab{max-width:160px}}@media(max-width:560px){.grid{grid-template-columns:1fr}.pane:nth-child(n+2){display:none}.preview span{display:none}.preview{padding:0 8px;font-size:11px}.content{padding-top:16px}.bar{height:36px}.tab{height:30px}.ico{height:30px;width:28px}.app-title{height:36px}}
</style>
<div class="preview"><b>交互预览</b><span>点击 Tab、＋、··· 体验；示例内容不连接真实 Agent</span><button id="guide">打开添加面板</button><button id="theme">切换浅色</button><button id="reset">重置</button></div>
<div class="shell"><aside><div class="nav">＋　新建工作区</div><div class="nav">◷　历史</div><div class="nav">⌕　搜索</div><div class="nav current">▥　跨 Workspace 分屏</div><div class="nav project"><i class="ws front">F</i>frontend</div><div class="nav small">Frontend workspace</div><div class="nav project"><i class="ws back">B</i>backend</div><div class="nav small">Backend workspace</div></aside><main class="app"><div class="app-title">分屏<span>×</span></div><div class="grid" id="grid"></div></main></div><div id="overlay"></div><div id="toast"></div>
<script>
const workspaces=[{id:'front',title:'Frontend workspace',project:'frontend',letter:'F'},{id:'back',title:'Backend workspace',project:'backend',letter:'B'}];
const existing=[{id:'a1',kind:'agent',ws:'front',name:'修复登录页交互'},{id:'a2',kind:'agent',ws:'back',name:'梳理 API 错误处理'},{id:'a3',kind:'agent',ws:'front',name:'检查构建与样式'},{id:'a4',kind:'agent',ws:'back',name:'数据库迁移评审'}];
let groups,seq=5,picker=null;
function initial(){groups=[{id:'g1',active:'a1',tabs:[existing[0],existing[1]]},{id:'g2',active:'a3',tabs:[existing[2],{id:'t1',kind:'terminal',ws:'front',name:'终端'}]}];picker=null;render();drawPicker()}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function icon(ws){const w=workspaces.find(w=>w.id===ws);return `<i class="ws ${w.id}">${w.letter}</i>`}
function message(s){const e=document.getElementById('toast');e.innerHTML=`<div class="toast">${esc(s)}</div>`;setTimeout(()=>e.innerHTML='',2000)}
function render(){document.getElementById('grid').innerHTML=groups.map(g=>`<section class="pane" data-group="${g.id}"><div class="bar"><div class="tabs" role="tablist">${g.tabs.map(t=>`<div class="tab ${g.active===t.id?'active':''}" title="${esc(t.name+' · '+workspaces.find(w=>w.id===t.ws).title)}"><button class="tab-main" style="display:contents" role="tab" aria-selected="${g.active===t.id}" data-open="${t.id}" data-group="${g.id}">${t.kind==='agent'||t.kind==='draft'?icon(t.ws):t.kind==='terminal'?'›_':'▤'}<span class="name">${esc(t.name)}</span></button><button class="close" aria-label="关闭 ${esc(t.name)}" data-close="${t.id}" data-group="${g.id}">×</button></div>`).join('')}</div><button class="ico plus" data-plus="${g.id}" aria-label="添加 Tab">＋</button><div class="tools"><button class="ico" data-max="${g.id}" title="放大 / 还原">⛶</button><button class="ico" data-menu="${g.id}" aria-label="分屏操作">···</button></div></div><div class="content">${body(g.tabs.find(t=>t.id===g.active))}</div></section>`).join('');}
function body(t){if(!t)return '<div class="new-empty">点击 ＋ 添加 Agent、终端或文件</div>';if(t.kind==='terminal')return '<div class="terminal"><span class="prompt">➜ frontend</span> npm run typecheck<br><br>Type check passed.<br><span class="prompt">➜ frontend</span> ▏</div>';if(t.kind==='file')return '<article class="file"><h2>Backend demo</h2><p>文件继续使用原生编辑器与预览。</p></article>';const draft=t.kind==='draft';return `${draft?'<div class="new-empty"><div>在 '+esc(workspaces.find(w=>w.id===t.ws).title)+' 中开始对话<small>沿用原生模型选择、权限和输入框</small></div></div><button class="import" data-native-import="1">↥ 导入会话</button>':`<div class="thread"><div class="user">${t.ws==='front'?'检查登录页的键盘操作，并修复焦点跳转。':'检查 API 的错误处理和返回格式。'}</div><div class="assistant"><p>${t.ws==='front'?'已检查登录页的表单与键盘导航。':'已梳理 API 的异常分支。'}</p><div class="tool">⌁ ${t.ws==='front'?'src/login.tsx':'src/api/errors.ts'}</div><p>现有交互与工作目录保持原样，可以继续在当前会话中对话。</p><div class="run">▧　工作了 12s</div></div></div>`}<div class="composer"><div class="placeholder">给 Agent 发消息，标记 @files，或使用 /commands</div><div class="bottom"><b>＋</b><span>Codex⌄</span><span>Max⌄</span><span>Full access⌄</span><span>◌　♩　↑</span></div></div>`}
function openPicker(group,anchor,mode='agent'){const r=anchor.getBoundingClientRect();picker={group,mode,query:'',scope:'all',dest:'current',x:Math.min(Math.max(8,r.left),innerWidth-358),y:r.bottom+5};drawPicker();setTimeout(()=>document.getElementById('query')?.focus(),0)}
function drawPicker(){const host=document.getElementById('overlay');if(!picker){host.innerHTML='';return}const p=picker;let rows='';if(p.mode==='menu'){rows=`<button class="row" data-action="split"><span>▥</span><span>新增分屏…</span></button><button class="row" data-action="move"><span>⇥</span><span>将当前 Tab 移到新分屏</span></button><button class="row" data-action="layout"><span>▥</span><span>切换排列方向</span></button><button class="row" data-action="equal"><span>＝</span><span>均分</span></button><button class="row" data-action="origin"><span>↗</span><span>在原 workspace 打开</span></button>`}else{const list=(p.mode==='new'?workspaces:existing).filter(t=>(p.scope==='all'||(t.ws??t.id)===p.scope)&&`${t.name??t.title} ${t.project??''} ${workspaces.find(w=>w.id===t.ws)?.project??''}`.toLowerCase().includes(p.query.toLowerCase()));rows=`<div class="search"><span>⌕</span><input id="query" aria-label="搜索" placeholder="${p.mode==='new'?'选择来源 workspace':'搜索 Agent 或 workspace'}" value="${esc(p.query)}"><kbd>Esc</kbd></div><div class="scope"><label for="scope">来源</label><select id="scope"><option value="all">所有 workspace</option>${workspaces.map(w=>`<option value="${w.id}" ${p.scope===w.id?'selected':''}>${w.project} / ${w.title}</option>`).join('')}</select>${p.mode==='new'?'<button data-action="back">← 已有 Agent</button>':''}</div>${p.mode==='agent'?'<div class="quick"><button class="row" data-action="new"><span>＋</span><span class="text"><span class="primary">新建 Agent</span></span><span class="trailing">选择 workspace →</span></button></div>':''}<div class="section">${p.mode==='new'?'新建到哪个 workspace':'已有 Agent'}</div><div class="rows">${list.length?list.map(t=>p.mode==='new'?`<button class="row" data-workspace="${t.id}">${icon(t.id)}<span class="text"><div class="primary">${esc(t.project)}</div><div class="secondary">${esc(t.title)}</div></span><span class="trailing">新建 →</span></button>`:`<button class="row" data-agent="${t.id}">${icon(t.ws)}<span class="text"><div class="primary">${esc(t.name)}</div><div class="secondary">${esc(workspaces.find(w=>w.id===t.ws).project+' / '+workspaces.find(w=>w.id===t.ws).title)}</div></span><span class="trailing">${groups.some(g=>g.tabs.some(x=>x.id===t.id))?'已打开':'↵'}</span></button>`).join(''):'<div class="empty">没有匹配的 Agent。<br>可换个关键词，或在指定 workspace 新建。</div>'}</div><div class="footer"><button data-action="terminal">›_ 终端</button><button data-action="file">▤ 文件</button><button class="dest" data-action="dest">${p.dest==='current'?'添加到当前分屏⌄':'添加到新分屏⌄'}</button></div>`}host.innerHTML=`<div class="scrim" data-dismiss="1"></div><div class="popover" role="dialog" aria-label="添加资源" style="left:${Math.max(8,p.x)}px;top:${Math.min(p.y,innerHeight-400)}px">${rows}</div>`;}
function add(t){const found=groups.find(g=>g.tabs.some(x=>x.id===t.id));if(found){found.active=t.id;message('已切换到该会话所在的 Tab')}else{let g=groups.find(g=>g.id===picker.group);if(picker.dest==='new'){g={id:'g'+seq++,tabs:[],active:null};groups.push(g)}g.tabs.push(t);g.active=t.id}picker=null;render();drawPicker()}
document.addEventListener('click',e=>{const b=e.target.closest('button,[data-dismiss]');if(!b)return;if(b.dataset.plus){openPicker(b.dataset.plus,b);return}if(b.dataset.menu){openPicker(b.dataset.menu,b,'menu');return}if(b.dataset.open){groups.find(g=>g.id===b.dataset.group).active=b.dataset.open;render();return}if(b.dataset.close){const g=groups.find(g=>g.id===b.dataset.group);g.tabs=g.tabs.filter(t=>t.id!==b.dataset.close);if(g.active===b.dataset.close)g.active=g.tabs[0]?.id;render();return}if(b.dataset.dismiss){picker=null;drawPicker();return}if(b.dataset.agent){add(existing.find(a=>a.id===b.dataset.agent));return}if(b.dataset.workspace){add({id:'draft'+seq++,kind:'draft',ws:b.dataset.workspace,name:'新建 Agent'});return}if(b.dataset.max){const panes=[...document.querySelectorAll('.pane')];const maximized=b.dataset.maximized==='yes';panes.forEach(p=>p.style.display=maximized?'':p.dataset.group===b.dataset.max?'flex':'none');document.getElementById('grid').style.gridTemplateColumns=maximized?'':'1fr';b.dataset.maximized=maximized?'no':'yes';return}if(b.dataset.nativeImport){openPicker(groups[0].id,document.querySelector('[data-plus]'));return}const a=b.dataset.action;if(!a)return;if(a==='new'){picker.mode='new';picker.query='';drawPicker();return}if(a==='back'){picker.mode='agent';drawPicker();return}if(a==='dest'){picker.dest=picker.dest==='current'?'new':'current';drawPicker();return}if(a==='terminal'||a==='file'){add({id:'resource'+seq++,kind:a==='file'?'file':'terminal',ws:picker.scope==='all'?'front':picker.scope,name:a==='file'?'README.md':'终端'});return}if(a==='split'){picker.dest='new';picker.mode='agent';drawPicker();return}if(a==='move'){const g=groups.find(g=>g.id===picker.group),t=g.tabs.find(t=>t.id===g.active);g.tabs=g.tabs.filter(x=>x.id!==t.id);g.active=g.tabs[0]?.id;groups.push({id:'g'+seq++,tabs:[t],active:t.id});picker=null;render();drawPicker();return}if(a==='layout'){const grid=document.getElementById('grid');grid.style.gridTemplateColumns=grid.style.gridTemplateColumns==='1fr'?'':'1fr'}if(a==='origin')message('实际插件将打开该资源所属 workspace');if(a==='equal')message('实际插件将恢复均分比例');picker=null;drawPicker()});
document.addEventListener('input',e=>{if(e.target.id==='query'){const start=e.target.selectionStart;picker.query=e.target.value;drawPicker();const q=document.getElementById('query');q.focus();q.setSelectionRange(start,start)}});document.addEventListener('change',e=>{if(e.target.id==='scope'){picker.scope=e.target.value;drawPicker()}});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&picker){picker=null;drawPicker();document.querySelector('[data-plus]')?.focus()}});document.getElementById('guide').onclick=()=>openPicker(groups[0].id,document.querySelector('[data-plus]'));document.getElementById('theme').onclick=()=>document.body.classList.toggle('light');document.getElementById('reset').onclick=initial;initial();
</script></html>
